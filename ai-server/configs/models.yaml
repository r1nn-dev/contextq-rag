llm:
  model: "gpt-4o-mini"              # 기본 생성 모델 — LLM_MODEL 환경 변수가 우선 (정책서 §5.5)
  temperature: 0                    # 정책서 §5.5
  max_tokens: 1024                  # 정책서 §5.5
  first_token_timeout_seconds: 10   # 요청~첫 토큰 제한 (정책서 §2.1 OpenAI 생성 첫 토큰)
  max_retries: 0                    # 스트림은 재시도하지 않는다 (중복·비용, 정책서 §2.1)

embedding:
  model: "text-embedding-3-small"  # 1536 dims (default)
  dimensions: 1536                 # INV-03 검사 기준 (정책서 §4.4 임베딩 차원·모델)
  batch_size: 100                  # 요청 1회당 입력 수
  timeout_seconds: 60
  max_retries: 3                   # OpenAI SDK 재시도 (지수 백오프)
  price_per_1m_tokens_usd: 0.02    # text-embedding-3-small 단가 — 비용 기록용
  query_timeout_seconds: 5         # 질의 임베딩 1회 제한 (정책서 §2.1 OpenAI 임베딩 호출)
  query_max_retries: 1             # 질의 임베딩 재시도 (멱등 호출)

rewrite:
  model: "gpt-4o-mini"              # 질의 재작성 모델 (rag-pipeline.md §3.1)
  temperature: 0
  max_tokens: 200                   # 출력 200자 이하 질의 한 줄 (정책서 §5.2)
  timeout_seconds: 3                # 정책서 §2.1 질의 재작성 호출 — 넘으면 원래 질문으로 폴백
  max_retries: 0                    # 폴백이 있으므로 재시도하지 않는다 (3초 예산)
