# 인덱스 빌드 청킹 설정 — docs/specs/doc-source.md §6, docs/experiments/protocol.md E2
# 값은 E2 비교 조건이다. 최종 전략·파라미터는 E2 결과(R-7-3)로 확정한다.
# 크기 단위: 문자 (LangChain 분할기 기본 단위)

# 정책서 미결정 사항 "청킹 전략" 가정값 (초기 개발용)
default_strategy: B

strategies:
  A:  # CharacterTextSplitter — 고정 크기 분할
    chunk_size: 1000
    chunk_overlap: 200
    separator: "\n\n"
  B:  # RecursiveCharacterTextSplitter — 재귀적 분리자 계층 분할
    chunk_size: 1000
    chunk_overlap: 200
    separators: ["\n\n", "\n", " "]
  C:  # 구조 인식 — H2 단위 묶음, 문단 경계 분할, 코드 펜스 원자 단위
    chunk_size: 1000
    header_levels: ["#", "##"]
    preserve_code_blocks: true
