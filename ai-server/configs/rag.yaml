# 서비스 검색·생성 설정 — ADR-008, docs/planning/policy.md §5.3·§5.5
# 값이 바뀌면 같은 평가셋으로 Before/After를 측정해 PR에 붙인다 (CONTRIBUTING.md §9.5).

retrieval:
  # Top-K — E2 확정 2026-11-18 (eval/results/E2/decision.md, eval/decision_rules.md §2):
  # 전략 C Hit@3 0.55 → Hit@5 0.65 → Hit@8 0.775, 두 증가폭 모두 ≥ 2%p → K=8
  top_k: 8
  # 컨텍스트 토큰 예산 3,000 고정 — 성능 우선으로 공식 축소 없이 상한 그대로 (eval/decision_rules.md §4)
  context_budget_tokens: 3000
  # NO_CONTEXT 임계값 τ (source_key별) — E1 확정 2026-11-18 (eval/results/E1/analysis.md,
  # eval/decision_rules.md §3·§5). 인덱스 검증 스모크도 이 값을 쓴다.
  # 환경 변수 TAU_{SOURCE_KEY}가 있으면 덮어쓴다. 소스를 추가하면 여기에도 등록한다.
  thresholds:
    langchain_v03: 0.29
    langchain_v1x: 0.34

generation:
  # 요청에 promptVersion이 없을 때 쓰는 단일 모드 프롬프트 (configs/prompts/{prompt_version}.j2)
  prompt_version: single_v2
  # 요청에 promptVersion이 없을 때 쓰는 비교 모드 프롬프트 (정책서 §5.6, rag-pipeline.md §5)
  compare_prompt_version: compare_v1

stream:
  # 정책서 §2.1 SSE 하트비트 · 단일 스트림 최대 시간, §8.1 ai-server 동시 생성 (E6에서 확정)
  heartbeat_seconds: 10
  max_duration_seconds: 120
  max_concurrency: 20
  # 정책서 §2.1 비교 모드 전체 타임아웃 — 요청~결과 30초, 넘으면 error(UPSTREAM_TIMEOUT)
  compare_max_duration_seconds: 30

rewrite:
  # 멀티턴 질의 재작성 (ADR-009, 정책서 §5.2) — 이력이 비면 재작성하지 않는다(SKIPPED)
  prompt_version: rewrite_v2      # configs/prompts/{prompt_version}.j2 — v2: 생략 대상·질문 언어 보강
  history_turns: 3                # 최근 3턴(6메시지)만 참조
  assistant_max_chars: 500        # 이전 답변은 앞 500자만 사용 (재작성 토큰 제어)
  max_output_chars: 200           # 넘으면 원래 질문으로 폴백 (rewritten_query VARCHAR(200))
