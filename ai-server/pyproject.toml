[project]
name = "ai-server"
version = "0.1.0"
description = "ContextQ RAG AI Server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",   # includes websocket, http2 support
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-chroma>=0.1.4",
    "chromadb>=0.5.3",
    "openai>=1.52.0",
    "pydantic-settings>=2.5.0",    # loads .env secrets + configs/*.yaml
    "PyYAML>=6.0.2",               # required by pydantic-settings for YAML loading
    "jinja2>=3.1.4",               # prompt templates: configs/prompts/*.j2
    "httpx>=0.27.0",               # document ingestion: fetch external docs
]

[dependency-groups]
dev = [
    "ruff>=0.6.9",
    "mypy>=1.11.0",
    "types-PyYAML>=6.0.12",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",               # async TestClient for FastAPI
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# src layout: ai-server/src/ is the package root
[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]    # E: pycodestyle, F: Pyflakes, I: isort, UP: pyupgrade
ignore = []

[tool.mypy]
strict = false
ignore_missing_imports = true      # ignore missing type stubs for third-party packages
python_version = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "llm: calls real LLM API (excluded from CI, incurs cost)",
    "eval: runs RAGAS evaluation metrics (excluded from CI, incurs cost)",
]