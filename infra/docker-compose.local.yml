services:
  backend:
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  ai-server:
    ports:
      - "${AI_SERVER_PORT:-8000}:8000"
    volumes:
      - ../ai-server/configs:/app/configs:ro  # 로컬 configs 핫리로드

  postgres:
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"  # Windows 로컬 PG 충돌 시 .env에서 5433으로 변경

  frontend:
    ports:
      - "${FRONTEND_PORT:-5173}:80"