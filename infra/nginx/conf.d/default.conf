server {
    listen 80;
    server_name _;

    # API 역방향 프록시 → backend:8080
    # /api/v1/health → http://backend:8080/v1/health (trailing slash로 /api 접두사 제거)
    location /api/ {
        proxy_pass         http://backend:8080/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE 스트리밍 필수 설정 — proxy_buffering 활성화 시 청크 지연 발생
        proxy_buffering    off;
        proxy_cache        off;
        add_header         X-Accel-Buffering no;

        # SSE 연결 유지 타임아웃 (기본 60s → timeout 발생)
        proxy_read_timeout    300s;
        proxy_connect_timeout  10s;
        proxy_send_timeout    300s;
    }

    # SPA 라우팅 → frontend 컨테이너 (nginx:alpine)
    location / {
        proxy_pass         http://frontend:80/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}