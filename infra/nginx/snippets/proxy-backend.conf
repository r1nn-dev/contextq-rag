# backend 프록시 공통 — 경로는 그대로 넘긴다(backend가 /api/v1/**, /swagger-ui를 직접 매핑).

proxy_pass         http://backend;
proxy_http_version 1.1;
proxy_set_header   Connection        "";
proxy_set_header   Host              $host;
proxy_set_header   X-Real-IP         $remote_addr;
proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header   X-Forwarded-Proto $scheme;
proxy_set_header   X-Request-Id      $req_id;
# backend도 같은 값을 응답 헤더로 돌려준다 — nginx가 붙이는 헤더 하나만 남긴다
proxy_hide_header  X-Request-Id;

# SSE 필수 — 버퍼링하면 토큰이 모였다가 한꺼번에 도착한다 (기획서 결정 5, ADR-003).
# backend 응답의 X-Accel-Buffering: no도 같은 뜻이다
proxy_buffering    off;
proxy_cache        off;

# 정책서 §2.1: 단일 스트림 최대 120초 < nginx 150초 (OpenAI < ai-server < backend < nginx)
proxy_read_timeout    150s;
proxy_send_timeout    150s;
proxy_connect_timeout 10s;
