# 보안 헤더 (정책서 §11) — add_header는 하위 블록에 add_header가 있으면 상속되지 않으므로
# add_header를 쓰는 location마다 이 파일을 다시 include한다.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options  "nosniff" always;
add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
add_header X-Request-Id            $req_id always;
# HSTS 1년 (정책서 §11). 브라우저는 HTTP 응답의 HSTS를 무시하므로 로컬 HTTP에도 같은 파일을 쓴다
add_header Strict-Transport-Security "max-age=31536000" always;
