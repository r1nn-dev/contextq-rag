user nginx;
worker_processes 1;  # 기획서 부록 A — worker 1 (메모리 약 20MB)
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # 요청 추적 ID (정책서 §9.4) — 클라이언트가 UUID를 보냈으면 그대로, 없거나 형식이 다르면 생성한다.
    # backend는 UUID 형식만 이어받으므로 nginx의 $request_id(32자 hex)를 UUID 형태로 바꾼다.
    map $request_id $generated_request_id {
        "~^(?<p1>[0-9a-f]{8})(?<p2>[0-9a-f]{4})(?<p3>[0-9a-f]{4})(?<p4>[0-9a-f]{4})(?<p5>[0-9a-f]{12})$" "$p1-$p2-$p3-$p4-$p5";
    }
    map $http_x_request_id $req_id {
        "~*^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" $http_x_request_id;
        default $generated_request_id;
    }

    # JSON 접근 로그 — 쿼리 문자열·본문은 남기지 않는다(질문 원문 미기록, 정책서 §9.4)
    log_format json escape=json
        '{"time":"$time_iso8601","requestId":"$req_id","remote":"$remote_addr",'
        '"method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"requestTime":$request_time,"upstreamTime":"$upstream_response_time",'
        '"userAgent":"$http_user_agent"}';
    access_log /dev/stdout json;

    sendfile          on;
    keepalive_timeout 65;
    client_max_body_size 1m;

    # text/event-stream은 압축하지 않는다(gzip_types 기본 목록에 없음) — SSE 지연 방지
    gzip       on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
