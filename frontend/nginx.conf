server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: serve index.html for all client-side routes (e.g. /chat, /history)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # proxy /api/* to backend container (use service name in Docker Compose network)
    location /api {
        proxy_pass http://contextq-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}