# common settings — loaded for all profiles

spring:
  application:
    name: contextq
  profiles:
    active: local             # override with SPRING_PROFILES_ACTIVE=prod in production

  datasource:
    hikari:
      data-source-properties:
        # every pooled connection resolves unqualified names in app
        options: "-c search_path=app"
      # KST session time zone (db-design §4). Set after connect: pgjdbc sends the JVM default
      # time zone as a startup parameter, which overrides a TimeZone given in options.
      connection-init-sql: "SET TIME ZONE 'Asia/Seoul'"

  mvc:
    async:
      request-timeout: 150s   # > stream max 120s (policy §2.1); = nginx proxy_read_timeout

  jpa:
    open-in-view: false       # disables Open Session in View anti-pattern
    hibernate:
      ddl-auto: validate      # Flyway manages schema; Hibernate validates only
    properties:
      hibernate:
        default_schema: app

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: app       # app schema is owned by backend Flyway; ai schema by ai-server Alembic
    schemas: app
    create-schemas: true

ai-server:
  base-url: ${AI_SERVER_INTERNAL_URL:http://localhost:8000}
  internal-token: ${INTERNAL_TOKEN:}   # X-Internal-Token (ADR-012); never logged
  connect-timeout: 3s                  # policy §2.1 WebClient 연결 타임아웃
  request-timeout: 5s                  # plain JSON calls (source list)
  first-event-timeout: 15s             # policy §2.1 첫 이벤트(meta) 타임아웃
  idle-timeout: 30s                    # policy §2.1 유휴 타임아웃
  sources-cache-ttl: 60s               # policy §2.1 메타 API 캐시

chat:
  sweeper:
    interval: 60s                      # policy §2.1 스위퍼 주기
    stale-after: 150s                  # policy §2.1 STREAMING·PENDING 고착 판정

app:
  admin:                               # policy §1.1 관리자 시드 (both empty → skipped)
    email: ${ADMIN_EMAIL:}
    password-bcrypt: ${ADMIN_PASSWORD_BCRYPT:}   # BCrypt hash, never the plain password

jwt:
  secret: ${JWT_SECRET}                # required, >= 32 bytes (api-spec 부록 D.1)
  access-token-ttl: ${JWT_ACCESS_TOKEN_EXPIRY_MINUTES:30}m   # policy §2.1
  clock-skew: 30s                      # policy §2.1 JWT 시계 오차 허용
  refresh-family-ttl: ${JWT_REFRESH_TOKEN_EXPIRY_DAYS:7}d    # policy §2.1 (absolute)
  refresh-reuse-grace: 5s              # policy §2.1 회전 경합 유예

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never     # health is public; hide component details

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui

server:
  port: 8080
