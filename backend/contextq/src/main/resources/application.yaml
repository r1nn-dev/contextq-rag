# common settings — loaded for all profiles

spring:
  application:
    name: contextq
  profiles:
    active: local             # override with SPRING_PROFILES_ACTIVE=prod in production

  datasource:
    hikari:
      data-source-properties:
        # every pooled connection resolves unqualified names in app and uses KST (db-design §4)
        options: "-c search_path=app -c TimeZone=Asia/Seoul"

  jpa:
    open-in-view: false       # disables Open Session in View anti-pattern
    hibernate:
      ddl-auto: validate      # Flyway manages schema; Hibernate validates only
    properties:
      hibernate:
        default_schema: app

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: app       # app schema is owned by backend Flyway; ai schema by ai-server Alembic
    schemas: app
    create-schemas: true

ai-server:
  base-url: ${AI_SERVER_INTERNAL_URL:http://localhost:8000}

jwt:
  secret: ${JWT_SECRET}       # required — set JWT_SECRET in .env
  expiration-ms: 86400000     # 24 hours in ms

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never     # health is public; hide component details

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui

server:
  port: 8080
