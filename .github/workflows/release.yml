name: Release Images

# main에 반영되면 nginx·backend·ai-server 이미지를 git SHA 태그로 GHCR에 올린다 (정책서 §9.4).
# - 태그는 40자 git SHA 하나만 붙인다. latest는 만들지 않는다(운영은 SHA로만 배포·롤백).
# - 이미지 경로 = ghcr.io/<owner>/<repo>/<서비스>:<sha> = Compose의 ${IMAGE_REGISTRY}/<서비스>:${IMAGE_TAG}.
# - 서버 배포는 이 워크플로가 하지 않는다. 운영 서버에서 deploy.sh <git-sha>로 pull·기동한다.
# - 수동 실행(workflow_dispatch)은 선택한 브랜치의 HEAD를 빌드한다(배포 리허설용).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: image (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: nginx
            context: frontend
            file: infra/nginx/Dockerfile
            build-contexts: nginxconf=infra/nginx
          - service: backend
            context: backend/contextq
            file: backend/contextq/Dockerfile
            build-contexts: ""
          - service: ai-server
            context: ai-server
            file: ai-server/Dockerfile
            build-contexts: ""
    steps:
      - uses: actions/checkout@v4

      - name: 이미지 경로 (GHCR은 소문자만 허용)
        id: ref
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "registry=${registry}" >> "$GITHUB_OUTPUT"
          echo "image=${registry}/${{ matrix.service }}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: 빌드·푸시
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-contexts: ${{ matrix.build-contexts }}
          push: true
          tags: ${{ steps.ref.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: 결과 요약
        run: |
          {
            echo "### ${{ matrix.service }}"
            echo ""
            echo "- 이미지: \`${{ steps.ref.outputs.image }}\`"
            echo "- 배포: \`IMAGE_REGISTRY=${{ steps.ref.outputs.registry }}\` · \`IMAGE_TAG=${GITHUB_SHA}\` (\`deploy.sh ${GITHUB_SHA}\`)"
          } >> "$GITHUB_STEP_SUMMARY"
