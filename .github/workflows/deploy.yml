      #     context: ./ai-server
      #     push: true
      #     tags: ghcr.io/${{ github.repository }}/ai-server:${{ github.sha }}

      # TODO: backend 이미지 빌드 — ./gradlew bootJar -x test 후 Docker 빌드
      # TODO: EC2 배포 (SSH + docker compose pull && docker compose up -d)

