name: CI

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  rag:
    name: rag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ai-server 존재 여부 확인
        id: check
        run: |
          if [ -d "ai-server" ] && [ -f "ai-server/pyproject.toml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "ai-server/ 없음 — 잡을 건너뜁니다."
          fi

      - name: uv 설치
        if: steps.check.outputs.exists == 'true'
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: ai-server/uv.lock

      - name: 의존성 설치
        if: steps.check.outputs.exists == 'true'
        working-directory: ai-server
        run: uv sync --locked

      - name: ruff lint
        if: steps.check.outputs.exists == 'true'
        working-directory: ai-server
        run: uv run ruff check .

      - name: ruff format 검사
        if: steps.check.outputs.exists == 'true'
        working-directory: ai-server
        run: uv run ruff format --check .

      - name: pytest (단위 테스트, llm·eval 제외)
        if: steps.check.outputs.exists == 'true'
        working-directory: ai-server
        run: uv run pytest -q -m "not llm and not eval"

  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: backend 존재 여부 확인
        id: check
        run: |
          if [ -d "backend" ] && [ -f "backend/gradlew" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "backend/ 없음 — 잡을 건너뜁니다."
          fi

      - name: JDK 21 설치
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: gradlew 실행 권한 부여
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: chmod +x gradlew

      - name: Spotless 포맷 검사
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: ./gradlew spotlessCheck

      - name: Gradle 빌드 및 테스트
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: ./gradlew build

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: frontend 존재 여부 확인
        id: check
        run: |
          if [ -d "frontend" ] && [ -f "frontend/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "frontend/ 없음 — 잡을 건너뜁니다."
          fi

      - name: Node.js 20 설치
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm ci

      - name: ESLint
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Vite 빌드
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm run build

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # private 레포일 경우 필요

  ci-gate:
    name: ci-gate
    needs: [rag, backend, frontend, secret-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 모든 CI 잡 결과 확인
        run: |
          echo "rag:         ${{ needs.rag.result }}"
          echo "backend:     ${{ needs.backend.result }}"
          echo "frontend:    ${{ needs.frontend.result }}"
          echo "secret-scan: ${{ needs.secret-scan.result }}"

          fail=false
          for result in \
            "${{ needs.rag.result }}" \
            "${{ needs.backend.result }}" \
            "${{ needs.frontend.result }}" \
            "${{ needs.secret-scan.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              fail=true
            fi
          done

          if [ "$fail" = "true" ]; then
            echo "::error::하나 이상의 CI 잡이 실패했습니다."
            exit 1
          fi
          echo "✅ 모든 CI 잡 통과 (또는 건너뜀)"